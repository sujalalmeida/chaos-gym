version: 1
project: refund-agent
target:
  entrypoint: chaosgym.refund.integration:run
  fixture: chaosgym.refund.integration:fixture
  input:
    variant: protected
    order_id: ORD-1042
    request_id: request-1042
    max_attempts: 2
scenario:
  name: lost-refund-acknowledgment
  fault:
    target: tool:refund_payment
    type: response_lost_after_commit
    on_call: 1
assertions:
  - type: effect_count
    effect: refund
    resource_id: ORD-1042
    equals: 1
  - type: effect_count
    effect: email
    resource_id: ORD-1042
    equals: 1
  - type: confirmation_after_refund
    resource_id: ORD-1042
  - type: completed
limits:
  timeout_seconds: 30
  max_tool_calls: 15
