[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosgym"
version = "0.1.0.dev0"
description = "Local reliability tests for AI applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "pydantic>=2,<3", "PyYAML>=6,<7"]

[project.scripts]
chaosgym = "chaosgym.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
