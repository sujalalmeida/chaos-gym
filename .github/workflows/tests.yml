name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Verify refund demonstration
        run: chaosgym demo refund --json > refund-demo.json
      - name: Verify packaged scenario template and supervised CLI
        run: |
          chaosgym init --path .chaosgym-ci.yaml
          chaosgym test .chaosgym-ci.yaml --json > scenario-result.json
      - name: Verify persistent run history and inspection
        run: |
          chaosgym history --json > history.json
          chaosgym show latest --json > saved-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          scenario = json.loads(Path("scenario-result.json").read_text())
          saved = json.loads(Path("saved-run.json").read_text())
          history = json.loads(Path("history.json").read_text())
          assert saved["run_id"] == scenario["run_id"]
          assert len(history["runs"]) == 3
          assert {run["status"] for run in history["runs"]} == {"passed", "failed"}
          PY
      - name: Save run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-runs-${{ matrix.python-version }}
          path: |
            .chaosgym/runs/
            refund-demo.json
            scenario-result.json
            history.json
            saved-run.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
